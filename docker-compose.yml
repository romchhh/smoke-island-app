# Host ports (same VPS as elf-duck-shop 3000–3006):
#   8080 web · 3010 API · 3017 MongoDB
name: smoke-island

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "3017:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { const s = rs.status(); if (s.ok && s.members.some(m => m.stateStr === 'PRIMARY')) quit(0); quit(1); } catch (e) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); } catch (e2) {} quit(1); }",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  api:
    image: smoke-island-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Use development for local HTTP; set NODE_ENV=production + HTTPS URLs on a real host.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/?replicaSet=rs0}
      DATABASE_NAME: ${DATABASE_NAME:-SmokeIslandLocal}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-docker-jwt-secret-32chars-min}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-docker-session-secret-32chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback}
      TELEGRAM_ADMIN_BOT_TOKEN: ${TELEGRAM_ADMIN_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_CLIENT_BOT_TOKEN: ${TELEGRAM_CLIENT_BOT_TOKEN:-}
      TELEGRAM_CLIENT_BOT_USERNAME: ${TELEGRAM_CLIENT_BOT_USERNAME:-}
      TELEGRAM_WEB_APP_URL: ${TELEGRAM_WEB_APP_URL:-http://localhost:8080}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:-}
      TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET:-}
      TELEGRAM_OIDC_REDIRECT_URI: ${TELEGRAM_OIDC_REDIRECT_URI:-http://localhost:8080/api/v1/auth/telegram/callback}
      TELEGRAM_ORDERS_CHAT_ID: ${TELEGRAM_ORDERS_CHAT_ID:-}
      TELEGRAM_SUPPORT_CHAT_ID: ${TELEGRAM_SUPPORT_CHAT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "3010:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    image: smoke-island-web:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      # Live frontend + certbot webroot (−w ./frontend). Recreate web after changing this.
      - ./frontend:/usr/share/nginx/html:ro

  seed:
    profiles: ["seed"]
    image: smoke-island-api:local
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-mongodb://mongo:27017/?replicaSet=rs0}
      DATABASE_NAME: ${DATABASE_NAME:-SmokeIslandLocal}
    command: ["node", "src/seed-demo.js"]
    restart: "no"

volumes:
  mongo_data:
