# Host ports (same VPS as elf-duck-shop 3000–3006):
#   3010 API
# MongoDB: Atlas (same cluster as Elf Duck, different DATABASE_NAME).
# Nginx is NOT in Compose — use host nginx (deploy/nginx.conf.example).
name: smoke-island

services:
  api:
    image: smoke-island-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Use development for local HTTP; set NODE_ENV=production + HTTPS URLs on a real host.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to MongoDB Atlas (mongodb+srv://...)}
      DATABASE_NAME: ${DATABASE_NAME:-SmokeIslandLocal}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8765}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3010}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8765,http://127.0.0.1:8765}
      JWT_SECRET: ${JWT_SECRET:-change-me-docker-jwt-secret-32chars-min}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-docker-session-secret-32chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3010/api/v1/auth/google/callback}
      TELEGRAM_ADMIN_BOT_TOKEN: ${TELEGRAM_ADMIN_BOT_TOKEN:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_CLIENT_BOT_TOKEN: ${TELEGRAM_CLIENT_BOT_TOKEN:-}
      TELEGRAM_CLIENT_BOT_USERNAME: ${TELEGRAM_CLIENT_BOT_USERNAME:-}
      TELEGRAM_WEB_APP_URL: ${TELEGRAM_WEB_APP_URL:-http://localhost:8765}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:-}
      TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET:-}
      TELEGRAM_OIDC_REDIRECT_URI: ${TELEGRAM_OIDC_REDIRECT_URI:-http://localhost:3010/api/v1/auth/telegram/callback}
      TELEGRAM_ORDERS_CHAT_ID: ${TELEGRAM_ORDERS_CHAT_ID:-}
      TELEGRAM_SUPPORT_CHAT_ID: ${TELEGRAM_SUPPORT_CHAT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "3010:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  seed:
    profiles: ["seed"]
    image: smoke-island-api:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to MongoDB Atlas (mongodb+srv://...)}
      DATABASE_NAME: ${DATABASE_NAME:-SmokeIslandLocal}
    command: ["node", "src/seed-demo.js"]
    restart: "no"
