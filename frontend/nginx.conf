server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;

    # Certbot webroot — must be before "deny all dotfiles"
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        allow all;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /config.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide build/meta files that may appear when ./frontend is bind-mounted
    location ~* ^/(Dockerfile|nginx\.conf|\.dockerignore)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
